<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - TechCon 2024</title>
</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="contact-info">
            <h2>Get In Touch</h2>
            <p>Email: <a href="mailto:email@example.com">email@example.com</a></p>
            
            <div id="social-media">
                <h3>Follow Us</h3>
                <ul>
                    <li><a href="https://twitter.com/techcon" target="_blank">Twitter</a></li>
                    <li><a href="https://linkedin.com/company/techcon" target="_blank">LinkedIn</a></li>
                    <li><a href="https://facebook.com/techcon" target="_blank">Facebook</a></li>
                    <li><a href="https://instagram.com/techcon" target="_blank">Instagram</a></li>
                </ul>
            </div>
        </section>

        <section id="venue-map">
            <h2>Conference Venue</h2>
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.635254037407!2d-122.4194154846817!3d37.774929279759!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085808c0f5f8f9f%3A0x7a7b42d5f0f5f8f9!2sMoscone%20Center%2C%20San%20Francisco%2C%20CA!5e0!3m2!1sen!2sus!4v1234567890123!5m2!1sen!2sus" 
                width="100%" 
                height="400" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </section>

        <section id="contact-form">
            <h2>Contact Us</h2>
            <form action="#" method="post">
                <div>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 TechCon Conference. All rights reserved.</p>
        <p>Contact: info@techcon2024.org | Follow us on social media</p>
    </footer>
</body>
</html>
